<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TP Cripto - Datos Blockchain</title>
  <style>
    :root { --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#9ca3af; --accent:#22c55e; --border:#1f2937; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { width: 420px; max-width: 96vw; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
    .card h1 { margin: 0 0 8px; font-size: 20px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .value { font-size: 40px; font-weight: 700; letter-spacing: 1px; margin: 8px 0 18px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: #0b1220; color: var(--text); }
    .btn { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; font-weight: 600; transition: transform .06s ease; }
    .btn:active { transform: scale(0.98); }
    .btn.inc { background: #0e2318; color: var(--accent); border-color: #1b5e2e; }
    .status { margin-top: 14px; font-size: 12px; color: var(--muted); white-space: pre-line; }
    .sep { height: 1px; background: var(--border); margin: 16px 0; }
    .footer { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
    a { color: #60a5fa; text-decoration: none; }
    .spinner { display:none; width:16px; height:16px; border-radius:50%; border:2px solid #94a3b8; border-top-color: transparent; animation: spin .8s linear infinite; }
    .loading .spinner { display:inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Datos de Blockchain</h1>
      <div class="sub">Valor actual de <code>data</code> leído del contrato</div>
      <div id="dataValue" class="value">—</div>

      <div class="row">
        <input id="amount" type="number" min="1" step="1" value="1" aria-label="Cantidad" />
        <button id="btnInc" class="btn inc">Aumentar</button>
        <div class="spinner" id="spinner" aria-hidden="true"></div>
      </div>

      <div class="status" id="status">Listo.</div>
      <div class="sep"></div>
      <div class="footer">
        <div>Backend: <code>/data</code>, <code>/sumar</code></div>
        <a href="/data" target="_blank" rel="noopener">ver /data</a>
      </div>
    </div>
  </div>
  <script src="/main.js"></script>
</body>
</html>
